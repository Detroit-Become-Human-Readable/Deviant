name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Deviant.slnx

      - name: Build
        run: dotnet build Deviant.slnx -c Release --no-restore -p:GenerateDesktopArtifacts=false

      - name: Test
        run: dotnet test Deviant.slnx -c Release --no-build

  publish-build:
    needs: build-and-test
    # Match the Visual Studio 2022 generator used by Build-Vgmstream.ps1.
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build verified codec tools
        shell: pwsh
        run: ./scripts/Build-CiAudioTools.ps1 -Destination "artifacts/ci-audio-tools-${{ github.run_id }}" -BuildDirectory "$env:RUNNER_TEMP/deviant-audio-build"

      - name: Test audio tools
        shell: pwsh
        run: |
          $env:DEVIANT_AUDIO_TOOLS = (Resolve-Path "artifacts/ci-audio-tools-${{ github.run_id }}").Path
          dotnet test tests/Deviant.Audio.Tests/Deviant.Audio.Tests.csproj -c Release

      - name: Publish desktop package
        shell: pwsh
        run: ./scripts/Publish-Desktop.ps1 -AudioToolsDirectory "artifacts/ci-audio-tools-${{ github.run_id }}"

      - name: Verify single-file desktop output
        shell: pwsh
        run: |
          $packageRoot = "artifacts/Deviant"
          $executables = @(Get-ChildItem -LiteralPath $packageRoot -File | Where-Object Extension -eq '.exe')
          if ($executables.Count -ne 1 -or $executables[0].Name -ne 'Deviant.exe') {
            throw 'The desktop package must contain one top-level application executable.'
          }
          $looseAppFiles = @(Get-ChildItem -LiteralPath $packageRoot -File | Where-Object {
            $_.Extension -in '.dll','.pdb' -or $_.Name -like '*.deps.json' -or $_.Name -like '*.runtimeconfig.json'
          })
          if ($looseAppFiles.Count -ne 0) { throw 'Loose application runtime files were found beside the executable.' }

      - name: Create checksums
        shell: pwsh
        run: |
          $paths = @('artifacts/Deviant-win-x64.zip','artifacts/Deviant-source.zip')
          $lines = foreach ($path in $paths) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))"
          }
          Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Value $lines -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deviant-${{ github.run_id }}
          path: |
            artifacts/Deviant-win-x64.zip
            artifacts/Deviant-source.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Deviant-${{ github.run_id }}
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: release-assets/*
